name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # SECURITY: `uses:` is frozen to a commit SHA instead of a branch, because
    # the referenced workflow holds `contents: write` on this repository and a
    # branch ref would let upstream code change what runs on release day.
    #
    # This is the same revision used by the official t8y2/dbx-plugin-s3
    # workflow. Bump it consciously when DBX publishes newer reusable-workflow
    # changes (see t8y2/dbx commits touching plugin-release-reusable.yml).
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@31ca3f773a02fabe7f23505cce93e7346c6394f8
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.6
